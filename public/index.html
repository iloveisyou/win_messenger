<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WIN Messenger</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="login-screen" class="screen active">
    <div class="login-container">
      <div class="login-logo">💌</div>
      <h1 class="login-title">WIN Messenger</h1>
      <p class="login-subtitle">소중한 사람들과 대화하세요</p>
      <input type="text" id="login-name" placeholder="이름을 입력하세요" maxlength="20" autofocus>
      <button id="login-btn" class="btn-primary">시작하기</button>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="main-screen" class="screen">
    <header class="main-header">
      <span id="header-title">친구</span>
      <div class="header-right">
        <span id="user-avatar" class="avatar-small"></span>
      </div>
    </header>

    <!-- 탭 콘텐츠 -->
    <div id="tab-content" class="tab-content">
      <!-- 친구 목록 -->
      <div id="friends-view" class="tab-view active">
        <div class="my-profile" id="my-profile"></div>
        <div class="divider"></div>
        <div class="section-title">친구 <span id="friends-count">0</span></div>
        <div id="friends-list" class="list"></div>
      </div>

      <!-- 채팅 목록 -->
      <div id="chats-view" class="tab-view">
        <div id="rooms-list" class="list"></div>
        <div id="no-rooms" class="empty-state">
          <p>💬</p>
          <p>채팅을 시작해보세요</p>
        </div>
      </div>

      <!-- 설정 -->
      <div id="settings-view" class="tab-view">
        <div class="settings-section">
          <h3>WIN Messenger</h3>
          <p class="settings-info">Socket.IO + LangChain + MCP</p>
          <div class="settings-item">
            <span>버전</span>
            <span>1.0.0</span>
          </div>
          <div class="settings-item">
            <span>AI 엔진</span>
            <span>Claude (LangChain)</span>
          </div>
          <div class="settings-item">
            <span>MCP 도구</span>
            <span>시간, 날씨, 계산, 번역</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 탭 바 -->
    <nav class="tab-bar">
      <button class="tab-item active" data-tab="friends">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" fill="currentColor"/></svg>
          <span class="tab-badge" id="badge-friends"></span>
        </div>
        <span>친구</span>
      </button>
      <button class="tab-item" data-tab="chats">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z" fill="currentColor"/></svg>
          <span class="tab-badge" id="badge-chats"></span>
        </div>
        <span>채팅</span>
      </button>
      <button class="tab-item" data-tab="settings">
        <div class="tab-icon-wrap">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/></svg>
        </div>
        <span>설정</span>
      </button>
    </nav>
  </div>

  <!-- 채팅 화면 -->
  <div id="chat-screen" class="screen">
    <header class="chat-header">
      <button id="chat-back" class="btn-icon">←</button>
      <span id="chat-title">채팅</span>
      <div class="header-right">
        <span id="chat-participant-count"></span>
        <button id="chat-invite" class="btn-icon" title="초대">+</button>
      </div>
    </header>
    <div id="chat-messages" class="chat-messages"></div>
    <div id="typing-indicator" class="typing-indicator hidden"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="메시지를 입력하세요">
      <button id="chat-send" class="btn-send">전송</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
